// ─── Password hashing — passwords are never stored in plain text ────
async function hashPassword(accountId, pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("bariline-v1|" + String(accountId) + "|" + String(pw || "")));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function checkPassword(account, pw) {
  if (account.passwordHash) return (await hashPassword(account.id, pw)) === account.passwordHash;
  return typeof account.password === "string" && pw === account.password;
}
// Convert any plain-text password still in the database into a hash (one time per account)
async function migratePasswordsToHash() {
  const db = getDb();
  if (!db || !window.crypto || !crypto.subtle) return;
  try {
    const snap = await db.collection("accounts").get();
    for (const d of snap.docs) {
      const a = d.data();
      if (typeof a.password !== "string") continue;
      const upd = {
        password: firebase.firestore.FieldValue.delete()

      if (!a.passwordHash) upd.passwordHash = await hashPassword(a.id, a.password);
      await d.ref.update(upd);
      usageCounters.writes++;

  } catch (e) {
    console.warn("[SECURITY] password migration skipped:", e && e.code);

}

// ─── IndexedDB for large blobs (warranty PDF template) ─────────────────────

const IDB_NAME = "bariline_idb";
const IDB_STORE = "blobs";
const IDB_VERSION = 1;
function openIdb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
  });
}
async function idbGet(key) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => {
      db.close();
      resolve(req.result || null);
    };
    req.onerror = () => {
      db.close();
      reject(req.error);
    };
  });
}
async function idbDelete(key) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
  });
}

// ─── Firestore Service Layer ────────────────────────────────────────────────

let _db = null;
let _dbReady = false;
function getDb() {
  if (_db && _dbReady) return _db;
  if (typeof firebase === "undefined") return null;
  if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);

  if (!_db) {
    _db = firebase.firestore();
    _dbReady = true;
    // Enable offline persistence (best-effort, won't block operations)
    _db.enablePersistence({
      synchronizeTabs: true
    }).catch(err => {
      console.warn("Firestore persistence failed:", err.code);
    });
  }
  return _db;
}

// ─── Aggressive compression to fit photos in Firestore ──────────────────────

function compressForFirestore(dataUrl, maxWidth = 600, quality = 0.4) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width,
        h = img.height;
      if (w > maxWidth) {
        h = Math.round(h * maxWidth / w);
        w = maxWidth;
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      let result = canvas.toDataURL("image/jpeg", quality);
      // If still too big, compress harder
      if (result.length > MAX_FIELD_SIZE) {
        const smallerW = Math.round(w * 0.6);
        const smallerH = Math.round(h * 0.6);
        canvas.width = smallerW;
        canvas.height = smallerH;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, smallerW, smallerH);
        ctx.drawImage(img, 0, 0, smallerW, smallerH);
        result = canvas.toDataURL("image/jpeg", 0.3);
      }
      resolve(result);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
async function shrinkFieldForFirestore(val) {
  if (typeof val !== "string" || !val.startsWith("data:") || val.length <= MAX_FIELD_SIZE) return val;
  return compressForFirestore(val);
}
const COLLECTIONS = {
  accounts: "accounts",
  workOrders: "workOrders",
  serviceCalls: "serviceCalls",
  installers: "installers",
  customers: "customers",
  inventory: "inventory",
  notifications: "notifications",
  usageStats: "usageStats"
};

// Read/write counters for usage monitoring
const usageCounters = {
  reads: 0,
  writes: 0,
  deletes: 0,
  sessionStart: Date.now()
};
// ─── Speed: work orders come from one live listener ─────────────────────────
// The jobs (with their photos / PDFs) are ~16 MB. Re-downloading them on every open and every
// refresh made the app slow on phones. The listener shows the copy saved on the device at once and
// then downloads only the jobs that changed. When fresh data arrives from the server, onServer() runs.
const woLive = { started: false, snap: null, fromCache: true, failed: false, waiters: [], onServer: null };
function startWorkOrdersLive() {
  const db = getDb();
  if (!db || woLive.started) return;
  woLive.started = true;
  const wake = () => woLive.waiters.splice(0).forEach(f => f());
  try {
    db.collection(COLLECTIONS.workOrders).onSnapshot({ includeMetadataChanges: true }, snap => {
      const fromCache = snap.metadata.fromCache;
      if (fromCache && snap.empty && !woLive.snap) return; // nothing saved on this device yet — wait for the server
      try { usageCounters.reads += snap.docChanges().length; } catch (e) {}
      const wasCache = woLive.fromCache;
      woLive.snap = snap;
      woLive.fromCache = fromCache;
      wake();
      if (wasCache && !fromCache && woLive.onServer) woLive.onServer();
    }, err => {
      console.warn("workOrders listener", err);
      woLive.failed = true;
      wake();
    });
  } catch (e) {
    woLive.failed = true;
  }
}
async function woLiveRead() {
  startWorkOrdersLive();
  if (!woLive.snap && !woLive.failed) await new Promise(res => {
    woLive.waiters.push(res);
    setTimeout(res, 60000);
  });
  if (woLive.failed || !woLive.snap) return null;
  return woLive.snap.docs.map(doc => loadLocalFields(COLLECTIONS.workOrders, { _docId: doc.id, ...doc.data() }));
}
async function fsLoadCollection(collectionName, fromServer) {
  const db = getDb();
  if (!db) return null;
  if (collectionName === COLLECTIONS.workOrders) {
    const live = await woLiveRead();
    if (live) return live;
  }
  try {
    const opts = fromServer ? {
      source: "server"
    } : {};
    const snapshot = await db.collection(collectionName).get(opts);
    usageCounters.reads += snapshot.size || 1;
    if (snapshot.empty) return [];
    return snapshot.docs.map(doc => loadLocalFields(collectionName, {
      _docId: doc.id,
      ...doc.data()
    }));
  } catch (err) {
    // If server fetch fails, fall back to cache
    if (fromServer) {
      try {
        const cached = await db.collection(collectionName).get({
          source: "cache"
        });
        usageCounters.reads += cached.size || 1;
        if (cached.empty) return [];
        return cached.docs.map(doc => loadLocalFields(collectionName, {
          _docId: doc.id,
          ...doc.data()
        }));
      } catch (e) {/* fall through */}
    }
    console.error("Firestore load error:", collectionName, err);
    return null;
  }
}

// ─── Integration fields (measurement + drawing systems) ────
// Added in memory only when an order is loaded. Nothing is written to the database
// until one of these fields actually changes, so existing orders stay untouched.
//   measurements: [{ hash, data, submittedAt, submittedBy }]  — every submitted measurement is kept;
//                 a correction is a NEW measurement, the latest one is the current one
//   drawing:      { hash, data, quoteAmount, hardwareList, savedAt, savedBy } | null
//   quoteApproved: manager approved the drawing price into `amount`
const WORK_ORDER_INTEGRATION_DEFAULTS = {
  measurements: [],
  drawing: null,
  quoteApproved: false
};
function withIntegrationDefaults(order) {
  if (!order || typeof order !== "object") return order;
  const out = {
    ...order

  Object.entries(WORK_ORDER_INTEGRATION_DEFAULTS).forEach(([k, v]) => {
    if (out[k] === undefined) out[k] = Array.isArray(v) ? [] : v;
  });
  return modularFromDelivery(out);
}
// A delivery note (תעודת משלוח) for a modular model WITHOUT a measurement: Madaf makes it an ordinary install job.
// From MODULAR_FROM_DELIVERY_SINCE on, the CRM treats it exactly like a modular job whose measurement was confirmed:
// פענוח מודולרי (sizes from the delivery note) → ממתין לזכוכית (מודולרי) → admin "מוכן — העבר למתקין".
const MODULAR_FROM_DELIVERY_SINCE = "2026-11-10";
function modularFromDelivery(w) {
  if (!w || w.productType === "custom" || w.modular === false || w.isSupply || w.measured) return w;
  if (!(w.madafDeliveryNo || w.madafDelivery && w.madafDelivery.no)) return w;
  if (String(w.createdDate || "") < MODULAR_FROM_DELIVERY_SINCE) return w;
  const text = [w.product].concat((w.madafDelivery && w.madafDelivery.lines || []).map(l => l.desc)).join(" | ");
  if (w.modular !== true && !textIsModular(text)) return w;
  return { ...w, productType: "custom", measured: true, measurementConfirmed: true, measurementConfirmedDate: w.measurementConfirmedDate || w.createdDate || null, modularReady: true, modularNoMeasure: true };
}
// When a job was added: exact time if known (new CRM jobs: createdAt; Madaf jobs: the first log line), else the day
function jobAddedKey(w) {

  if (first && first.date && first.time && (!w.createdDate || first.date === w.createdDate)) return first.date + " " + first.time;

}
// ─── Modular models (פענוח מודולרי) ────

}
// A home with BOTH a modular (פרופיל) shower and a צירים נקיים one: runs the modular flow (פענוח), and the

// Fixed side panels in stock ("קיר צד וושינגטון 39" …) → the list the installer chooses from when measuring a modular model
let FIXED_SIDE_SIZES = [];
function loadFixedSideSizes() {
  const db = getDb();
  if (!db) return;
  db.collection("stockItems").where("kind", "==", "model").get().then(snap => {
    const sizes = new Set();
    snap.docs.forEach(d => {

      if (m) sizes.add(Number(m[1]));

const TYPE_OF = { "קבוע": "fixed", "דלת": "door", "הרמוניקה": "harm" };
const layoutSides = str => str.split("/").map(x => x.trim().split("+").map(t => TYPE_OF[t.trim()]));
// Which modular model a measured shower option is: by its written name, else by its layout (mirror images count)
function detectModularModel(o) {
  if (!o) return null;
  const sides = (o.sides || []).map(sd => (sd.els || []).map(e => e.type));
  if (!sides.length || sides.some(sd => !sd.length)) return { model: null, why: "אין תצורה במדידה" };
  // stored: first side wall→corner, last side corner→wall
  const norm = sides.length >= 2 ? [sides[0], sides[sides.length - 1].slice().reverse()] : sides;
  const key = arr => arr.join("+");
  const same = (a, b) => {
    if (a.length !== b.length) return false;
    if (a.length === 1) return key(a[0]) === key(b[0]) || key(a[0]) === key(b[0].slice().reverse());
    return key(a[0]) === key(b[0]) && key(a[1]) === key(b[1]) || key(a[0]) === key(b[1]) && key(a[1]) === key(b[0]);
  };
  let byLayout = Object.keys(MODULAR_LAYOUTS).filter(m => same(norm, layoutSides(MODULAR_LAYOUTS[m])));
  if (byLayout.includes("אלסקה")) {
    // אלסקה: the door turns on the fixed glass; פתיחה מהאמצע: on the wall
    const els = o.sides[0].els, d = els.findIndex(e => e.type === "door");
    const fixedLeft = els[d - 1] && els[d - 1].type === "fixed";
    const onWall = els[d].hinge === (fixedLeft ? "right" : "left");
    byLayout = [onWall ? "אלסקה פתיחה מהאמצע" : "אלסקה"];
  }
  const typed = Object.keys(MODULAR_LAYOUTS).sort((a, b) => b.length - a.length).find(m => normModular(o.model).includes(normModular(m)));
  const width = (o.sides || []).reduce((s, sd) => s + (sd.els || []).reduce((t, e) => t + (Number(e.w) || 0), 0), 0);
  const fromLayout = byLayout[0] || null;
  if (typed && fromLayout && !(typed === fromLayout || typed.startsWith("אלסקה") && fromLayout.startsWith("אלסקה")))
    return { model: fromLayout, typed, width, warn: `נכתב "${typed}" אבל התצורה היא של ${fromLayout}` };
  if (typed) return { model: typed.startsWith("אלסקה") && fromLayout ? fromLayout : typed, width, how: "name" };
  if (fromLayout) return { model: fromLayout, width, how: "layout" };
  return { model: null, width, why: "התצורה לא מתאימה לאף דגם מודולרי" };
}
function modularPrice(model, finish, width) {
  const p = MODULAR_PRICES[model] || MODULAR_PRICE_DEFAULTS[model];
  if (!p) return null;
  const black = String(finish || "").includes("שחור");
  if (p.upTo && width > p.upTo) return black ? p.b2 : p.n2;
  return black ? p.b : p.n;
}

// Fields that contain large base64 data — save to localStorage instead of Firestore
const LOCAL_STORAGE_FIELDS = ["measurementPhoto", "orderPdfData", "signedWarrantyData"];
const PHOTO_FIELDS = ["photos"];
function saveLocalFields(collectionName, docId, data) {
  try {
    // Save oversized photo fields to localStorage as backup
    if (data.photos && typeof data.photos === "object") {
      const photoData = {};
      Object.entries(data.photos).forEach(([key, val]) => {
        if (typeof val === "string" && val.length > MAX_FIELD_SIZE) {
          photoData[key] = val;
        }
      });
      if (Object.keys(photoData).length > 0) {
        localStorage.setItem(`fs_photos_${collectionName}_${docId}`, JSON.stringify(photoData));
      }
    }
    LOCAL_STORAGE_FIELDS.forEach(field => {
      if (data[field] && typeof data[field] === "string" && data[field].length > MAX_FIELD_SIZE) {
        localStorage.setItem(`fs_${field}_${collectionName}_${docId}`, data[field]);
      }
    });
  } catch (e) {
    console.warn("localStorage save failed:", e);
  }
}
function loadLocalFields(collectionName, doc) {
  try {
    const docId = doc.id || doc._docId;
    if (!docId) return doc;
    const result = {
      ...doc
    };
    // Restore photos from localStorage ONLY if Firestore has `true` (stripped marker)
    // If Firestore has a URL string, it came from Storage — don't override
    const savedPhotos = localStorage.getItem(`fs_photos_${collectionName}_${docId}`);
    if (savedPhotos) {
      try {
        const parsed = JSON.parse(savedPhotos);
        const merged = {
          ...(result.photos || {})
        };
        Object.entries(parsed).forEach(([key, val]) => {
          // Only restore from localStorage if Firestore value is missing or `true`
          if (!merged[key] || merged[key] === true) merged[key] = val;
        });
        result.photos = merged;
      } catch (e) {}
    }
    // Restore other large fields — only if Firestore has `true` (stripped)
    LOCAL_STORAGE_FIELDS.forEach(field => {
      if (result[field] === true || !result[field]) {
        const saved = localStorage.getItem(`fs_${field}_${collectionName}_${docId}`);
        if (saved) result[field] = saved;
      }
    });
    return result;
  } catch (e) {
    return doc;
  }
}

// Compress an image (base64 data URL) to fit within Firestore limits
// Returns a promise that resolves to a compressed base64 JPEG string
function compressImage(dataUrl, maxWidth = 800, quality = 0.55) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width,
        h = img.height;
      if (w > maxWidth) {
        h = Math.round(h * maxWidth / w);
        w = maxWidth;
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(dataUrl); // fallback to original if compression fails
    img.src = dataUrl;
  });
}

// Process signature image to ensure white background (fixes transparent/black background issue)
function processSignatureWhiteBg(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL("image/png"));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Create a signed warranty PDF by stamping the customer's signature onto the warranty PDF
// Exact field positions from the Bariline warranty template:
//   "תאריך:_________"  → x: 378.8–505.5, pdf-y: 366.6–378.9
//   "שם לקוח:__________" → x: 131.1–241.1, pdf-y: 366.6–378.9
//   "חתימה:_____________" → x: 234.5–354.9, pdf-y: 323.4–335.7
async function createSignedWarrantyPdf(warrantyBase64, signatureDataUrl, customerName, orderId, completedDate) {
  try { await window.brlPdfReady; } catch (e) {}
  if (!window.PDFLib) {
    console.warn("pdf-lib not loaded");
    return null;
  }
  try {
    const {
      PDFDocument,
      rgb
    } = window.PDFLib;
    const pdfBase64 = warrantyBase64.includes(",") ? warrantyBase64.split(",")[1] : warrantyBase64;
    const pdfBytes = Uint8Array.from(atob(pdfBase64), c => c.charCodeAt(0));
    const pdfDoc = await PDFDocument.load(pdfBytes);
    // Process signature to ensure white background (fixes black background issue)
    const processedSig = await processSignatureWhiteBg(signatureDataUrl);
    const sigBase64 = processedSig.includes(",") ? processedSig.split(",")[1] : processedSig;
    const sigBytes = Uint8Array.from(atob(sigBase64), c => c.charCodeAt(0));
    let sigImage;
    if (processedSig.includes("image/png")) {
      sigImage = await pdfDoc.embedPng(sigBytes);
    } else {
      sigImage = await pdfDoc.embedJpg(sigBytes);
    }
    const pages = pdfDoc.getPages();
    const page = pages[0]; // warranty is single page

    // ── Place signature on the "חתימה:_____________" line ──
    // The signature field spans x:234.5–354.9, y:323.4–335.7 (from bottom)
    // Place signature image just above the line, centered on the field
    const sigFieldX = 234.5;
    const sigFieldY = 323.4;
    const sigFieldW = 120; // width of underline area
    // Scale signature to fit the field width, max 120pt
    const sigW = Math.min(sigFieldW, sigImage.width * 0.35);
    const sigH = sigImage.height / sigImage.width * sigW;
    // Center signature horizontally on the field, place just above the line
    const sigX = sigFieldX + (sigFieldW - sigW) / 2;
    const sigY = sigFieldY + 2; // sit right on the line
    page.drawImage(sigImage, {
      x: sigX,
      y: sigY,
      width: sigW,
      height: sigH
    });

    // ── Fill in date on "תאריך:_________" field ──
    // Date field: x:378.8–505.5, y:366.6–378.9
    const dateStr = completedDate || new Date().toISOString().split("T")[0];
    const font = await pdfDoc.embedFont("Helvetica");
    page.drawText(dateStr, {
      x: 400,
      y: 369,
      size: 10,
      font,
      color: rgb(0.1, 0.1, 0.1)
    });

    // ── Fill in customer name on "שם לקוח:__________" field ──
    // Name field: x:131.1–241.1, y:366.6–378.9
    // For Hebrew text we can't use Helvetica, so draw with the embedded font if possible
    // Fallback: draw in Latin characters or use a trick with the existing font
    try {
      page.drawText(customerName, {
        x: 145,
        y: 369,
        size: 10,
        font,
        color: rgb(0.1, 0.1, 0.1)
      });
    } catch (nameErr) {
      // Hebrew chars may fail with Helvetica — that's ok, signature + date are most important
      console.warn("Could not write customer name (Hebrew font not available):", nameErr);
    }

    // ── Add order ID as small reference text ──
    page.drawText(orderId, {
      x: sigFieldX,
      y: sigFieldY - 10,
      size: 7,
      font,
      color: rgb(0.5, 0.5, 0.5)
    });
    const signedBytes = await pdfDoc.save();
    let binary = "";
    const bytes = new Uint8Array(signedBytes);
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return "data:application/pdf;base64," + btoa(binary);
  } catch (err) {
    console.error("Failed to create signed warranty PDF:", err);
    return null;
  }
}

// Deep-sanitize an object for Firestore: remove undefined, functions, symbols, convert special types
function sanitizeForFirestore(obj) {
  if (obj === null || obj === undefined) return null;
  if (typeof obj === "boolean" || typeof obj === "number" || typeof obj === "string") return obj;
  if (Array.isArray(obj)) return obj.map(sanitizeForFirestore).filter(v => v !== undefined);
  if (typeof obj === "object") {
    const clean = {};
    Object.entries(obj).forEach(([key, val]) => {
      if (val === undefined || typeof val === "function" || typeof val === "symbol") return; // skip
      clean[key] = sanitizeForFirestore(val);
    });
    return clean;
  }
  return null; // fallback — skip unsupported types
}

// Max size per field for Firestore storage (300KB base64 ≈ 225KB raw image)
const MAX_FIELD_SIZE = 300000;
function isBase64Large(val) {
  return typeof val === "string" && val.startsWith("data:") && val.length > MAX_FIELD_SIZE;
}
function stripLargeFields(data) {
  const clean = {
    ...data
  };
  delete clean._docId;
  // Strip only large base64 photos — keep URLs (from Storage) and small base64
  if (clean.photos && typeof clean.photos === "object") {
    const stripped = {};
    Object.entries(clean.photos).forEach(([key, val]) => {
      stripped[key] = isBase64Large(val) ? true : val;
    });
    clean.photos = stripped;
  }
  // Strip only large base64 fields — keep URLs from Firebase Storage
  LOCAL_STORAGE_FIELDS.forEach(field => {
    if (isBase64Large(clean[field])) {
      clean[field] = true;
    }
  });
  return clean;
}
async function shrinkLargeFields(data) {
  const result = {
    ...data
  };
  // Compress photos to fit in Firestore
  if (result.photos && typeof result.photos === "object") {
    const shrunk = {
      ...result.photos
    };
    for (const [key, val] of Object.entries(shrunk)) {
      shrunk[key] = await shrinkFieldForFirestore(val);
    }
    result.photos = shrunk;
  }
  // Compress large string fields
  for (const field of LOCAL_STORAGE_FIELDS) {
    if (result[field]) {
      result[field] = await shrinkFieldForFirestore(result[field]);
    }
  }
  return result;
}
// changedKeys (optional): write ONLY these top-level fields, merged into the existing document.
// This prevents a device with slightly stale data from overwriting fields that another
// device (or the measurement / drawing modules) changed in the meantime.
async function fsSaveDocument(collectionName, docId, data, changedKeys) {
  const db = getDb();
  if (!db) return false;
  try {
    // Save original large base64 fields to localStorage as high-res backup
    saveLocalFields(collectionName, docId, data);
    let toWrite = data;
    if (Array.isArray(changedKeys)) {
      toWrite = {};
      changedKeys.forEach(k => {
        if (k in data) toWrite[k] = data[k];
      });
      if (Object.keys(toWrite).length === 0) return true;
    }
    // Compress large photos/PDFs to fit within Firestore 1MB doc limit
    const shrunk = await shrinkLargeFields(toWrite);
    // Strip any remaining oversized fields (safety net)
    const stripped = stripLargeFields(shrunk);
    // Deep-sanitize to remove undefined/functions that Firestore rejects
    const cleanData = sanitizeForFirestore(stripped);
    console.log("[SAVE] Writing to Firestore:", collectionName, docId, Object.keys(cleanData).length, "fields", changedKeys ? "(changed only)" : "(full, merge)");
    // merge:true — never wipes fields that this device doesn't know about
    await db.collection(collectionName).doc(String(docId)).set(cleanData, {
      merge: true
    });
    usageCounters.writes++;
    console.log("[SAVE] SUCCESS:", collectionName, docId);
    return true;
  } catch (err) {
    console.error("[SAVE] FAILED:", collectionName, docId, err);
    return false;
  }
}
async function fsDeleteDocument(collectionName, docId) {
  const db = getDb();
  if (!db) return false;
  try {
    const ref = db.collection(collectionName).doc(String(docId));
    // Safety net: keep a copy in _trash before deleting, so nothing is ever lost for good
    try {
      const snap = await ref.get();
      if (snap.exists) {
        await db.collection("_trash").doc(`${collectionName}__${docId}__${Date.now()}`).set({
          collection: collectionName,
          docId: String(docId),
          deletedAt: new Date().toISOString(),
          data: snap.data()
        });
        usageCounters.writes++;
      }
    } catch (trashErr) {
      // If we cannot keep a copy, do NOT delete
      console.error("Trash copy failed — delete cancelled:", collectionName, docId, trashErr);
      return false;
    }
    await ref.delete();
    usageCounters.deletes++;
    return true;
  } catch (err) {
    console.error("Firestore delete error:", collectionName, docId, err);
    return false;
  }
}
async function fsSeedCollection(collectionName, items, idField = "id") {
  const db = getDb();
  if (!db) return;
  const batch = db.batch();
  items.forEach(item => {
    const docRef = db.collection(collectionName).doc(String(item[idField]));
    batch.set(docRef, item);
  });
  await batch.commit();
  usageCounters.writes += items.length;
}
async function fsSaveUsageStats() {
  const db = getDb();
  if (!db) return;
  const today = new Date().toISOString().slice(0, 10);
  const docRef = db.collection(COLLECTIONS.usageStats).doc(today);
  try {
    const doc = await docRef.get();
    if (doc.exists) {
      const existing = doc.data();
      await docRef.update({
        reads: (existing.reads || 0) + usageCounters.reads,
        writes: (existing.writes || 0) + usageCounters.writes,
        deletes: (existing.deletes || 0) + usageCounters.deletes,
        lastUpdated: new Date().toISOString()
      });
    } else {
      await docRef.set({
        date: today,
        reads: usageCounters.reads,
        writes: usageCounters.writes,
        deletes: usageCounters.deletes,
        lastUpdated: new Date().toISOString()
      });
    }
    usageCounters.reads = 0;
    usageCounters.writes = 0;
    usageCounters.deletes = 0;
  } catch (err) {
    console.warn("Usage stats save failed:", err);
  }
}

// ─── PDF Renderer (renders PDF pages into canvases) ─────────────────────────

const PdfRenderer = ({
  pdfData,
  containerRef
}) => {
  useEffect(() => {
    if (!pdfData || !containerRef.current) return;
    const container = containerRef.current;
    const renderPdf = async () => {
      try {
        const base64 = pdfData.split(",")[1];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        try { await window.brlPdfReady; } catch (e) {}
        const pdf = await window.pdfjsLib.getDocument({
          data: bytes
        }).promise;
        container.innerHTML = "";
        const dpr = window.devicePixelRatio || 1;
        // Use 4x minimum scale for crisp text
        const hiResScale = Math.max(dpr, 4);
        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const baseViewport = page.getViewport({
            scale: 1
          });
          // Use full container width
          const displayWidth = Math.max(container.clientWidth, 350);
          const cssScale = displayWidth / baseViewport.width;
          const renderScale = cssScale * hiResScale;
          const viewport = page.getViewport({
            scale: renderScale
          });
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = displayWidth + "px";
          canvas.style.height = Math.round(displayWidth * baseViewport.height / baseViewport.width) + "px";
          canvas.style.display = "block";
          canvas.style.marginBottom = "10px";
          canvas.style.background = "#fff";
          // Enable crisp rendering
          canvas.style.imageRendering = "auto";
          container.appendChild(canvas);
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          await page.render({
            canvasContext: ctx,
            viewport
          }).promise;
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">שגיאה בטעינת PDF</div>';
        console.error("PDF render error:", err);
      }
    };
    renderPdf();
  }, [pdfData, containerRef]);
  return null;
};

// checks the admin sees for each job in a request
function pickupChecks(p, workOrders) {
  return p.jobIds.map(id => {
    const w = workOrders.find(x => x.id === id);
    const l = lockOf(id);
    const probs = [];
    if (!w) probs.push("העבודה לא נמצאה");
    else {
      if (w.installerId !== p.installerId) probs.push("לא משויכת למתקין הזה");
      if (["completed", "cancelled", "rejected"].includes(w.status)) probs.push(w.status === "completed" ? "כבר הושלמה" : "בוטלה");
      if (!readyForPickup(w) && isOpenJob(w)) probs.push("עוד לא מוכנה (זכוכית / פענוח)");
    }
    if (l && l.pickupId !== p.id && (LOCK_ACTIVE.includes(l.status) || LOCK_TAKEN.includes(l.status))) probs.push(LOCK_TAKEN.includes(l.status) ? "כבר נאספה" : "בבקשת איסוף אחרת");
    return { id, w, probs };
  });
}

  let maxNum = 0;
  if (Array.isArray(workOrders)) {
    workOrders.forEach(wo => {
      if (wo.id && typeof wo.id === "string") {
        const match = wo.id.match(/WO-\d+-(\d+)/);
        if (match) {
          const num = parseInt(match[1], 10);
          if (num > maxNum) maxNum = num;
        }
      }
    });
  }
  const year = new Date().getFullYear();
  return `WO-${year}-${String(maxNum + 1).padStart(3, "0")}`;

      spec: spec.replace(/\s+/g, " "),

    const u2 = db.collection("_meta").doc("madafPartMap").onSnapshot(d => setPartMap(d.exists && d.data().map || {}), e => console.warn("madafPartMap", e));
    const u3 = db.collection("stockItems").where("kind", "==", "model").onSnapshot(s => setStockItems(s.docs.map(d => d.data())), e => console.warn("stockItems", e));

      u1();
      u2();

    const ref = getDb().collection("_meta").doc("madafPartMap");

        const prev = partMap[it.key];
        const v = prompt(`עלות ליחידה (₪, לפני מע"מ) עבור:\n${it.name}`, String(prev && prev.lastCost != null ? prev.lastCost : ""));

      "שורות שהטקסט שלהן שונה מהרשימה או שנכתבו ידנית — נבחרות בדוח עצמו. ",
      "המחיר ללקוח תמיד נלקח מתעודת המשלוח עצמה. ",
      h("b", null, `${done} מתוך ${items.length} פריטים מסומנים`), catalog.updatedAt ? ` · רשימה ממדף מ-${new Date(catalog.updatedAt).toLocaleDateString("he-IL")}` : ""),

      h("label", { style: { display: "flex", gap: 6, fontSize: 13, alignItems: "center" } },
        h("input", { type: "checkbox", checked: onlyOpen, onChange: e => setOnlyOpen(e.target.checked) }), "רק פריטים שלא סומנו")),
    h(Card, { style: { padding: 0, overflowX: "auto" } }, h("table", { style: { width: "100%", borderCollapse: "collapse", fontSize: 13 } },

      h("tbody", null, shown.map(it => {

    setStock({
      items: it.docs.map(d => d.id),
      containers: co.docs.map(d => d.id),
      moves: mv.docs.filter(d => (d.data().at || "") < CLEANUP_KEEP_FROM).map(d => d.id),
      keptMoves: mv.docs.filter(d => (d.data().at || "") >= CLEANUP_KEEP_FROM).length
    });
  };
  useEffect(() => {
    load().catch(e => console.warn("cleanup load", e));
  }, []);
  const oldJobs = workOrders.filter(w => (w.createdDate || "") < CLEANUP_KEEP_FROM);
  const keptJobs = workOrders.length - oldJobs.length;
  const ask = text => (prompt(text + '\n\nכדי לאשר הקלידו: מחק') || "").trim() === "מחק";
  const deleteStock = async () => {

async function runDeliveryStock(jobs, partMap, costs, stockItems) {
  for (const job of jobs) {
    const d = job.madafDelivery;
    if (!d || !Array.isArray(d.lines)) continue;
    for (let idx = 0; idx < d.lines.length; idx++) {
      const line = d.lines[idx];
      const k = d.no + ":" + idx;
      const m = lineMapping(line, partMap);
      const entry = costs[String(d.no)] && costs[String(d.no)].lines && costs[String(d.no)].lines[idx];
      if (deliveryStockDone.has(k) || entry || !m || m.via === "suggest" || m.mode !== "stock") continue;
      if (!job.isSupply && isModularJob(job) && textIsModular(line.desc)) continue; // its items leave stock in the decode
      const target = stockItems.find(i => i.id === m.stockItemId);
      if (!target) continue;
      deliveryStockDone.add(k);
      try {
        await takeDeliveryLine(job, idx, line, target);
      } catch (e) {
        console.warn("delivery stock", d.no, e);
        deliveryStockDone.delete(k);

    }
  }

async function autoDeliveryStock(workOrders) {

  if (!db || Date.now() - deliveryStockLastRun < 3 * 60 * 1000) return;
  deliveryStockLastRun = Date.now();
  const mapDoc = await db.collection("_meta").doc("madafPartMap").get();
  const partMap = mapDoc.exists && mapDoc.data().map || {};
  if (!Object.values(partMap).some(m => m && m.mode === "stock")) return;
  const catDoc = await db.collection("_meta").doc("madafItems").get();
  const catalog = catDoc.exists && catDoc.data().items || {};
  const supplies = (await db.collection("storeSupplies").get()).docs.map(d => d.data()).filter(s => s.madafDelivery).map(supplyAsJob);
  const jobs = workOrders.filter(w => w.madafDelivery && w.madafDelivery.no).concat(supplies)
    .map(j => ({ ...j, madafDelivery: { ...j.madafDelivery, lines: withCatalog(j.madafDelivery.lines, catalog) } }));
  const pending = jobs.filter(j => (j.madafDelivery.lines || []).some((l, idx) => {
    const m = lineMapping(l, partMap);
    return !deliveryStockDone.has(j.madafDelivery.no + ":" + idx) && m && m.via !== "suggest" && m.mode === "stock";
  }));
  if (!pending.length) return;
  const stockItems = (await db.collection("stockItems").where("kind", "==", "model").get()).docs.map(d => d.data());
  const costs = {};
  for (const j of pending) {
    const d = await db.collection("deliveryCosts").doc(String(j.madafDelivery.no)).get();

}

  if (entry && entry.mode === "manual") return (Number(entry.unitCost) || 0) * qty;

  const setWarrantyPdf = useCallback(val => {

  // ─── PWA Install Prompt ────

  const [serviceCalls, setServiceCallsState] = useState([]);

  const dbReadyRef = useRef(false);

  // ─── Save status indicator + toast ────

  const saveTimerRef = useRef(null);

  // ─── localStorage fallback for data safety ────
  const saveToLocalBackup = useCallback((collectionName, data) => {
    try {
      const stripped = data.map(item => {
        const clean = {
          ...item
        };
        // Remove large base64 fields to fit in localStorage
        if (clean.photos && typeof clean.photos === "object") {
          const p = {
            ...clean.photos
          };
          Object.keys(p).forEach(k => {
            if (typeof p[k] === "string" && p[k].length > 10000) p[k] = true;
          });
          clean.photos = p;
        }
        ["measurementPhoto", "orderPdfData", "pdfData", "signedWarrantyData"].forEach(f => {
          if (typeof clean[f] === "string" && clean[f].length > 10000) clean[f] = true;
        });
        return clean;
      });
      localStorage.setItem(`bariline_backup_${collectionName}`, JSON.stringify(stripped));
    } catch (e) {
      console.warn("localStorage backup failed:", e);
    }
  }, []);
  const loadFromLocalBackup = useCallback(collectionName => {
    try {
      const saved = localStorage.getItem(`bariline_backup_${collectionName}`);
      if (saved) return JSON.parse(saved);

    return null;
  }, []);

  // ─── Pending saves queue — retries saves that failed because DB wasn't ready ────
  const pendingQueueRef = useRef([]);
  // Saves that failed — retried by the "save all" button (instead of rewriting every document)
  const failedSavesRef = useRef(new Map());
  const flushPendingQueue = useCallback(async () => {
    if (pendingQueueRef.current.length === 0) return;
    const queue = [...pendingQueueRef.current];
    pendingQueueRef.current = [];
    console.log("Flushing", queue.length, "pending Firestore saves...");
    for (const {
      collectionName,
      item,
      idField
    } of queue) {
      try {
        await fsSaveDocument(collectionName, item[idField], item);
      } catch (e) {
        console.error("Flush save failed:", e);
      }
    }
  }, []);

  // ─── Firestore sync helper — saves changed items OUTSIDE setState ────
  const syncToFirestore = useCallback(async (collectionName, prev, next, idField = "id") => {
    if (!Array.isArray(next)) {
      console.warn("[SYNC] next is not array for", collectionName);
      return;
    }
    console.log("[SYNC] syncToFirestore called:", collectionName, "prev:", Array.isArray(prev) ? prev.length : "none", "next:", next.length);
    // Always save to localStorage as safety net
    saveToLocalBackup(collectionName, next);
    if (!dbReadyRef.current) {
      // Queue new/changed items for later save when DB becomes ready
      console.warn("DB not ready, queuing save for", collectionName);
      const prevMap = new Map();
      if (Array.isArray(prev)) prev.forEach(item => prevMap.set(String(item[idField]), item));
      for (const item of next) {
        const key = String(item[idField]);
        if (!prevMap.has(key)) {
          pendingQueueRef.current.push({
            collectionName,
            item,
            idField
          });
        }
      }
      return;
    }
    if (!getDb()) {
      console.warn("Firestore not available, data saved to localStorage backup for", collectionName);
      return;
    }
    showSaveStatus("saving");
    const prevMap = new Map();
    if (Array.isArray(prev)) prev.forEach(item => prevMap.set(String(item[idField]), item));
    const nextIds = new Set(next.map(item => String(item[idField])));
    let allOk = true;
    // Save changed/new items
    for (const item of next) {
      const key = String(item[idField]);
      const prevItem = prevMap.get(key);
      // Only save if item is new or changed (compare sanitized versions)
      const prevClean = prevItem ? sanitizeForFirestore(stripLargeFields(prevItem)) : null;
      const nextClean = sanitizeForFirestore(stripLargeFields(item));
      const prevStr = prevClean ? JSON.stringify(prevClean) : null;
      const nextStr = JSON.stringify(nextClean);
      if (!prevStr || prevStr !== nextStr) {
        // For existing items, write only the fields that actually changed
        let changedKeys;
        if (prevClean) {
          changedKeys = Object.keys(nextClean).filter(k => {
            if (JSON.stringify(nextClean[k]) === JSON.stringify(prevClean[k])) return false;
            // Never push an empty integration default over data that may exist on the server
            if (!(k in prevClean) && k in WORK_ORDER_INTEGRATION_DEFAULTS && JSON.stringify(nextClean[k]) === JSON.stringify(WORK_ORDER_INTEGRATION_DEFAULTS[k])) return false;
            return true;
          });
        }
        console.log("[SYNC] Item changed/new, saving:", collectionName, item[idField], prevStr ? "CHANGED " + changedKeys.join(",") : "NEW");
        const ok = await fsSaveDocument(collectionName, item[idField], item, changedKeys);
        if (!ok) {
          allOk = false;
          failedSavesRef.current.set(collectionName + "::" + key, {
            collectionName,
            item,
            changedKeys
          });
          console.error("[SYNC] SAVE FAILED for", collectionName, item[idField]);
        } else {
          failedSavesRef.current.delete(collectionName + "::" + key);
        }
      }
    }
    // Delete removed items
    if (Array.isArray(prev)) {
      for (const item of prev) {
        if (!nextIds.has(String(item[idField]))) {
          await fsDeleteDocument(collectionName, item[idField]);
        }
      }
    }
    // Wait for writes to actually reach the server before reporting success
    if (allOk) {
      try {
        const db = getDb();
        if (db) await db.waitForPendingWrites();
      } catch (e) {
        console.warn("waitForPendingWrites:", e);
        allOk = false;
      }
    }
    showSaveStatus(allOk ? "saved" : "error");
  }, [saveToLocalBackup]);

  // ─── Firestore sync wrappers ────
  const workOrdersRef = useRef(workOrders);
  workOrdersRef.current = workOrders;
  const setWorkOrders = useCallback(updater => {
    const prev = workOrdersRef.current;
    const next = typeof updater === "function" ? updater(prev) : updater;
    console.log("[WO] setWorkOrders: prev count:", prev ? prev.length : 0, "next count:", next ? next.length : 0);
    if (next && prev && next.length > prev.length) {
      const newIds = next.filter(n => !prev.some(p => p.id === n.id)).map(n => n.id);
      console.log("[WO] NEW work orders:", newIds);
    }
    workOrdersRef.current = next; // Immediately update ref to prevent stale reads
    setWorkOrdersState(next);
    syncToFirestore(COLLECTIONS.workOrders, prev, next);
  }, [syncToFirestore]);
  const accountsRef = useRef(accounts);
  accountsRef.current = accounts;
  const setAccounts = useCallback(updater => {

    accountsRef.current = next;

    syncToFirestore(COLLECTIONS.accounts, prev, next);

  const serviceCallsRef = useRef(serviceCalls);
  serviceCallsRef.current = serviceCalls;
  const setServiceCalls = useCallback(updater => {

  const installersRef = useRef(installers);

    installersRef.current = next;

  // ─── Force save ALL data to Firestore ────
  const forceSaveAll = useCallback(async () => {
    const db = getDb();
    if (!db) {
      showSaveStatus("error");
      return;
    }
    showSaveStatus("saving");
    let allOk = true;
    const collections = [{
      name: COLLECTIONS.workOrders,
      data: workOrdersRef.current
    }, {
      name: COLLECTIONS.accounts,
      data: accountsRef.current
    }, {
      name: COLLECTIONS.serviceCalls,
      data: serviceCallsRef.current
    }, {
      name: COLLECTIONS.installers,
      data: installersRef.current
    }];
    // Keep the local safety copy up to date
    for (const {
      name,
      data
    } of collections) {
      if (Array.isArray(data)) saveToLocalBackup(name, data);
    }
    // Every change is already saved automatically. Here we only retry the saves
    // that failed, and items still waiting in the queue — we do NOT rewrite every
    // document, because a device with older data could overwrite newer changes.
    await flushPendingQueue();
    for (const [mapKey, {
      collectionName,
      item,
      changedKeys
    }] of Array.from(failedSavesRef.current.entries())) {
      const ok = await fsSaveDocument(collectionName, item.id, item, changedKeys);
      if (ok) failedSavesRef.current.delete(mapKey);else {
        allOk = false;
        console.error("Force save failed:", collectionName, item.id);
      }
    }
    // Wait for ALL pending writes to actually reach the server
    try {
      await db.waitForPendingWrites();
    } catch (e) {
      console.error("waitForPendingWrites failed:", e);
      allOk = false;
    }
    // Verify by reading back from server
    if (allOk) {
      try {
        const verify = await db.collection(COLLECTIONS.workOrders).limit(1).get({
          source: "server"
        });
        console.log("Server verification: workOrders has", verify.size, "docs");
        if (verify.size === 0 && workOrdersRef.current.length > 0) {
          allOk = false;
          console.error("VERIFICATION FAILED: server has 0 docs but local has", workOrdersRef.current.length);
        }
      } catch (e) {
        console.warn("Server verification failed (offline?):", e);
      }
    }
    showSaveStatus(allOk ? "saved" : "error");
  }, [saveToLocalBackup, flushPendingQueue]);

  // ─── Load/refresh data from Firestore ────
  const refreshFromFirestore = useCallback(async isInitial => {
    const db = getDb();
    if (!db) {
      if (isInitial) {
        setDbStatus("offline");
        // Try localStorage backup when offline
        const backupAccounts = loadFromLocalBackup(COLLECTIONS.accounts);
        setAccountsState(backupAccounts && backupAccounts.length > 0 ? backupAccounts : ACCOUNTS_DATA);
        const backupWO = loadFromLocalBackup(COLLECTIONS.workOrders);
        if (backupWO && backupWO.length > 0) {
          setWorkOrdersState(backupWO);
          workOrdersRef.current = backupWO;
        }
        const backupSC = loadFromLocalBackup(COLLECTIONS.serviceCalls);
        if (backupSC && backupSC.length > 0) setServiceCallsState(backupSC);
        const backupInst = loadFromLocalBackup(COLLECTIONS.installers);
        if (backupInst && backupInst.length > 0) {
          setInstallersState(backupInst);
          installersRef.current = backupInst;
        }
        dbReadyRef.current = true;
        setDbReady(true);
      }
      return;
    }
    try {
      // ALWAYS force server reads to ensure we get the latest data
      const forceServer = true;
      let [fsAccounts, fsWorkOrders, fsServiceCalls, fsInstallers] = await Promise.all([fsLoadCollection(COLLECTIONS.accounts, forceServer), fsLoadCollection(COLLECTIONS.workOrders, forceServer), fsLoadCollection(COLLECTIONS.serviceCalls, forceServer), fsLoadCollection(COLLECTIONS.installers, forceServer)]);

      // SAFE SEEDING: Only seed if this is the very first time EVER (use localStorage flag)
      // This prevents re-seeding when Firestore temporarily returns empty
      // Check BOTH localStorage AND Firestore for seed flag — covers new devices too
      const hasBeenSeededLocal = localStorage.getItem("bariline_db_seeded");
      let hasBeenSeededRemote = false;
      try {
        const db = getDb();
        if (db) {
          const flagDoc = await db.collection("_meta").doc("seed_flag").get();
          hasBeenSeededRemote = flagDoc.exists;
        }
      } catch (e) {}
      const hasBeenSeeded = hasBeenSeededLocal || hasBeenSeededRemote;
      // Always set local flag if remote flag exists (sync for this device)
      if (hasBeenSeededRemote && !hasBeenSeededLocal) localStorage.setItem("bariline_db_seeded", "true");
      if (isInitial && !hasBeenSeeded) {
        let didSeed = false;
        if (fsAccounts && fsAccounts.length === 0) {
          await fsSeedCollection(COLLECTIONS.accounts, ACCOUNTS_DATA);
          fsAccounts = ACCOUNTS_DATA;
          didSeed = true;
        }
        if (fsWorkOrders && fsWorkOrders.length === 0) {
          await fsSeedCollection(COLLECTIONS.workOrders, WORK_ORDERS_DATA);
          fsWorkOrders = WORK_ORDERS_DATA;
          didSeed = true;
        }
        if (fsServiceCalls && fsServiceCalls.length === 0) {
          await fsSeedCollection(COLLECTIONS.serviceCalls, SERVICE_CALLS_DATA);
          fsServiceCalls = SERVICE_CALLS_DATA;
          didSeed = true;
        }
        if (fsInstallers && fsInstallers.length === 0) {
          await fsSeedCollection(COLLECTIONS.installers, INSTALLERS_DATA);
          fsInstallers = INSTALLERS_DATA;
          didSeed = true;
        }
        const [fsCust, fsInv] = await Promise.all([fsLoadCollection(COLLECTIONS.customers), fsLoadCollection(COLLECTIONS.inventory)]);
        if (fsCust && fsCust.length === 0) await fsSeedCollection(COLLECTIONS.customers, CUSTOMERS_DATA);
        if (fsInv && fsInv.length === 0) await fsSeedCollection(COLLECTIONS.inventory, INVENTORY_DATA);
        // Mark as seeded in BOTH localStorage AND Firestore — so no device ever re-seeds
        localStorage.setItem("bariline_db_seeded", "true");
        try {
          const db = getDb();
          if (db) await db.collection("_meta").doc("seed_flag").set({
            seeded: true,
            date: new Date().toISOString()
          });
        } catch (e) {}
      } else if (isInitial && hasBeenSeeded) {
        // DB was seeded before — if Firestore returns empty, it means a real problem, not first load
        // Don't overwrite with defaults! Just use whatever Firestore gives us.
      }

      // Update state with Firestore data (no sync-back)
      // Use localStorage backup as fallback if Firestore returns empty
      if (fsAccounts && fsAccounts.length > 0) {
        setAccountsState(fsAccounts);
        saveToLocalBackup(COLLECTIONS.accounts, fsAccounts);
      } else if (isInitial) {
        const backup = loadFromLocalBackup(COLLECTIONS.accounts);
        if (backup && backup.length > 0) setAccountsState(backup);else setAccountsState(ACCOUNTS_DATA);
      }
      if (fsWorkOrders && fsWorkOrders.length > 0) {
        fsWorkOrders = fsWorkOrders.map(withIntegrationDefaults);
        setWorkOrdersState(fsWorkOrders);
        workOrdersRef.current = fsWorkOrders;
        saveToLocalBackup(COLLECTIONS.workOrders, fsWorkOrders);
      } else if (isInitial) {
        const backup = loadFromLocalBackup(COLLECTIONS.workOrders);
        if (backup && backup.length > 0) {
          setWorkOrdersState(backup);
          workOrdersRef.current = backup;
        }
      }
      if (fsServiceCalls && fsServiceCalls.length > 0) {
        setServiceCallsState(fsServiceCalls);
        saveToLocalBackup(COLLECTIONS.serviceCalls, fsServiceCalls);
      } else if (isInitial) {
        const backup = loadFromLocalBackup(COLLECTIONS.serviceCalls);
        if (backup && backup.length > 0) setServiceCallsState(backup);
      }
      if (fsInstallers && fsInstallers.length > 0) {
        setInstallersState(fsInstallers);
        installersRef.current = fsInstallers;
        saveToLocalBackup(COLLECTIONS.installers, fsInstallers);
      } else if (isInitial) {
        const backup = loadFromLocalBackup(COLLECTIONS.installers);
        if (backup && backup.length > 0) {
          setInstallersState(backup);
          installersRef.current = backup;
        }
      }
      setDbStatus("online");
    } catch (err) {
      console.error("Firestore load error:", err);
      if (isInitial) {
        setDbStatus("offline");
        // Offline fallback: try localStorage backup first, then defaults for accounts
        const backupAccounts = loadFromLocalBackup(COLLECTIONS.accounts);
        setAccountsState(backupAccounts && backupAccounts.length > 0 ? backupAccounts : ACCOUNTS_DATA);
        const backupWO = loadFromLocalBackup(COLLECTIONS.workOrders);
        if (backupWO && backupWO.length > 0) {
          setWorkOrdersState(backupWO);
          workOrdersRef.current = backupWO;
        }
        const backupSC = loadFromLocalBackup(COLLECTIONS.serviceCalls);
        if (backupSC && backupSC.length > 0) setServiceCallsState(backupSC);
        const backupInst = loadFromLocalBackup(COLLECTIONS.installers);
        if (backupInst && backupInst.length > 0) {
          setInstallersState(backupInst);
          installersRef.current = backupInst;
        }
      }
    }
    if (isInitial) {
      dbReadyRef.current = true;
      setDbReady(true);
      // Flush any saves that were queued while DB was loading
      setTimeout(() => flushPendingQueue(), 100);
      // Load warranty PDF from Firestore (ensures all devices get the latest version)
      const wpDb = getDb();
      if (wpDb) {
        wpDb.collection("_meta").doc("warrantyPdf").get().then(function (doc) {
          if (doc.exists && doc.data() && doc.data().base64) {
            console.log("[WARRANTY] Loaded from Firestore (post-init):", doc.data().name);
            setWarrantyPdfState({
              name: doc.data().name,
              base64: doc.data().base64
            });
            idbSet("warrantyPdf", {
              name: doc.data().name,
              base64: doc.data().base64
            }).catch(function () {});
          }
        }).catch(function (e) {
          console.warn("[WARRANTY] Post-init load failed:", e);
        });
      }
    }
  }, [saveToLocalBackup, loadFromLocalBackup, flushPendingQueue]);

  // Initial load on mount
  useEffect(() => {
    refreshFromFirestore(true);
  }, [refreshFromFirestore]);
  // The first screen may come from the copy saved on this phone — refresh as soon as the server answers
  useEffect(() => {
    woLive.onServer = () => refreshFromFirestore(false);
